# What has to hold before anything from this repository is published.
#
# Every build here goes through ./build.sh --docker, which is the same command a contributor
# runs. That is deliberate: the way a "works in CI" and a "works on my machine" diverge is by
# being two different scripts, so there is one, and the pinned digest in docker/IMAGE makes it
# the same compiler on both sides.
#
# Only plugins/stub is built. It exercises the whole path - the image, both targets, the SDK's
# import audit and the ABI floor - in under a minute, where the emulator plugins are hundreds
# of megabytes of upstream each. Adding them is a question of what a runner's time is worth,
# not of coverage of anything this checks.
name: CI

on:
  push:
    branches: [main]
  pull_request:

# To pull the toolchain image. Needed only while the package is private: the point of hosting
# it publicly is that an outside plugin author pulls the same digest with no credentials at
# all, and when it is public this and the login step below both come out.
permissions:
  contents: read
  packages: read

jobs:
  checks:
    name: Repository checks
    runs-on: ubuntu-24.04
    steps:
      # Full history: a clone of a shallow repository ignores --shared, and the publish gate's
      # selftest reproduces a commit that no ref names.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # A tag here would let CI and a contributor build with different compilers while both
      # looked correct, so it is refused before anything is built.
      - name: The toolchain image is pinned by digest
        run: ./scripts/check_image_pin.sh

      - name: The smoke host's own tests
        run: ./smoke/selftest.sh

      - name: prepare_upstream's own tests
        run: ./scripts/upstream_selftest.sh

      - name: The publish gate's own tests
        run: ./scripts/publish_gate_selftest.sh

  anchors:
    name: Channel anchors
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      # Every committed channel root must parse, carry the keys it names, and
      # meet its own threshold, or nothing will ever bootstrap from it.
      - name: Check every committed root
        run: |
          set -euo pipefail
          shopt -s nullglob
          for root in channels/*/root.json; do
            echo "::group::$root"
            jq -e '.signed._type == "root"' "$root" > /dev/null \
              || { echo "::error::$root is not root metadata"; exit 1; }
            jq -e '[.signed.roles[].keyids[]] - (.signed.keys | keys) | length == 0' "$root" > /dev/null \
              || { echo "::error::$root names a key id it does not carry"; exit 1; }
            threshold=$(jq -r '.signed.roles.root.threshold' "$root")
            signatures=$(jq -r '.signatures | length' "$root")
            if [ "$signatures" -lt "$threshold" ]; then
              echo "::error::$root carries $signatures signature(s) for a threshold of $threshold"
              exit 1
            fi
            expires=$(jq -r '.signed.expires' "$root")
            remaining=$(( ( $(date -u -d "$expires" +%s) - $(date -u +%s) ) / 86400 ))
            echo "root: $threshold of $(jq -r '.signed.roles.root.keyids | length' "$root") key(s), $signatures signature(s), expires in $remaining day(s)"
            if [ "$remaining" -lt 0 ]; then
              echo "::error file=$root::root has expired; no client can bootstrap this channel"
              exit 1
            elif [ "$remaining" -lt 180 ]; then
              echo "::warning file=$root::root expires in $remaining days; renew it"
            fi
            echo "::endgroup::"
          done

      - uses: ./.github/actions/retrovert-publish

  build:
    name: Build (${{ matrix.target }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        target: [x86_64, aarch64]
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build through the pinned image
        run: ./build.sh stub release --docker --target ${{ matrix.target }}

      # glibc floor, no dynamically linked C++ runtime, and nothing exported but the entry
      # point. The build being green says none of that; this does.
      - name: Audit the artifact
        run: |
          if [ "${{ matrix.target }}" = x86_64 ]; then
              build=build/docker-release
          else
              build=build/docker-${{ matrix.target }}-release
          fi
          ./scripts/check_abi_floor.sh "$build/plugins/stub/stub.so"

      # The one thing that differs between this runner and a contributor's machine is where the
      # checkout sits, and -ffile-prefix-map is what has to absorb that. Building the same
      # commit from a second path and comparing the bytes is the check that it does.
      - name: The artifact does not depend on where it was built
        run: |
          if [ "${{ matrix.target }}" = x86_64 ]; then
              build=build/docker-release
          else
              build=build/docker-${{ matrix.target }}-release
          fi
          elsewhere="${RUNNER_TEMP}/a-different-path"
          git clone --shared . "$elsewhere"
          (cd "$elsewhere" && ./build.sh stub release --docker --target ${{ matrix.target }})
          here="$(sha256sum "$build/plugins/stub/stub.so" | cut -d' ' -f1)"
          there="$(sha256sum "$elsewhere/$build/plugins/stub/stub.so" | cut -d' ' -f1)"
          echo "$here  this checkout"
          echo "$there  $elsewhere"
          if [ "$here" != "$there" ]; then
              echo "The same commit built two different artifacts depending on its path." >&2
              exit 1
          fi
