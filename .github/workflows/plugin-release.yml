# A <plugin>/vX.Y.Z tag: build that plugin for both targets, run the publish gate and its smoke on
# the packed archives on the machine each targets, and store the archives and its index entry,
# attested to this workflow and tag, on the tag's release. No channel changes until a roster pins
# the version and a <channel>/vN tag gathers it. See channels/RELEASING.md.
name: Plugin release

on:
  push:
    tags:
      - '*/v*'
      - '!dev/v*'
      - '!stable/v*'

permissions:
  contents: read

concurrency:
  group: plugin-release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  plan:
    runs-on: ubuntu-24.04
    outputs:
      plugin: ${{ steps.tag.outputs.plugin }}
    steps:
      - uses: actions/checkout@v4

      - name: Parse the tag
        id: tag
        run: |
          read -r plugin version < <(scripts/release.py tag "$GITHUB_REF_NAME")
          echo "plugin=$plugin" >> "$GITHUB_OUTPUT"

  # aarch64 is cross-compiled, exactly as ./build.sh --docker does anywhere else.
  build:
    needs: plan
    name: Build (${{ matrix.target }})
    runs-on: ubuntu-24.04
    # packages: read pulls the toolchain image, only while it is private.
    permissions:
      contents: read
      packages: read
    strategy:
      matrix:
        target: [x86_64, aarch64]
    env:
      PLUGIN: ${{ needs.plan.outputs.plugin }}
    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build
        run: ./build.sh "$PLUGIN" release --docker --target ${{ matrix.target }}

      - name: Pack
        run: |
          if [ "${{ matrix.target }}" = x86_64 ]; then build=build/docker-release; else build=build/docker-${{ matrix.target }}-release; fi
          scripts/release.py pack --build-dir "$build" --target ${{ matrix.target }} --out packed "$PLUGIN"
          mkdir -p smoke-host
          cp "$build/smoke/replay_smoke" smoke-host/

      - uses: actions/upload-artifact@v4
        with:
          name: packed-${{ matrix.target }}
          path: packed/
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        with:
          name: smoke-host-${{ matrix.target }}
          path: smoke-host/
          if-no-files-found: error

  validate:
    needs: [plan, build]
    name: Validate (${{ matrix.target }})
    strategy:
      matrix:
        include:
          - target: x86_64
            runner: ubuntu-24.04
          - target: aarch64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    env:
      PLUGIN: ${{ needs.plan.outputs.plugin }}
    steps:
      # The gate reads the SDK's import audit from the submodule.
      - uses: actions/checkout@v4
        with:
          submodules: true

      - uses: actions/download-artifact@v4
        with:
          name: packed-${{ matrix.target }}
          path: packed

      - uses: actions/download-artifact@v4
        with:
          name: smoke-host-${{ matrix.target }}
          path: smoke-host

      - name: Unpack as a build tree
        run: |
          mkdir -p stage/smoke
          install -m 755 smoke-host/replay_smoke stage/smoke/replay_smoke
          scripts/release.py unpack --artifacts packed --target ${{ matrix.target }} --into stage "$PLUGIN"

      - name: Gate and smoke
        run: scripts/release.py validate --build-dir stage --out entries "$PLUGIN"

      - uses: actions/upload-artifact@v4
        with:
          name: entries-${{ matrix.target }}
          path: entries/
          if-no-files-found: error

  store:
    needs: [plan, validate]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      id-token: write
      attestations: write
    env:
      PLUGIN: ${{ needs.plan.outputs.plugin }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          pattern: packed-*
          path: set
          merge-multiple: true

      - uses: actions/download-artifact@v4
        with:
          pattern: entries-*
          path: entries

      - name: Keep the index entry
        run: scripts/release.py entry --out set --entries entries/entries-x86_64 --entries entries/entries-aarch64 "$PLUGIN"

      # What lets a channel release trust these files without rebuilding them.
      - uses: actions/attest-build-provenance@v2
        with:
          subject-path: set/*

      - name: Store the release
        run: |
          scripts/stage_release.sh "$GITHUB_REF_NAME" \
            "$PLUGIN, built and validated for linux-x86_64 and linux-arm64. A channel publishes it once its roster pins this version." \
            set/*
