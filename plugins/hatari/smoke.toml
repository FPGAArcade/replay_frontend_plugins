# The smoke run for this plugin: ./build.sh hatari --smoke.

# No fixture: hatariB compiles EmuTOS into the artifact, so the machine boots to the EmuTOS desktop
# with an empty drive. That is a real boot with nothing to redistribute, which is the cleanest
# smoke an emulator can have.

# The boot screen is up by frame 450, EmuTOS then clears the screen for about 250 frames, and the
# desktop is drawn and stays by frame 800. This lands well past that, not in the gap.
frames = 1200

# The watchdog, not a budget: the run itself takes a couple of seconds.
timeout_seconds = 60

# EmuTOS reaches its desktop in silence.
audio = false
